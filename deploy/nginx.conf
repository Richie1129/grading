user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 經 Cloudflare Tunnel 進來時，真實 client IP 在 CF-Connecting-IP；
    # 直接內網存取（127.0.0.1:8080）時該 header 為空，退回 $remote_addr。
    # 主程式記錄 IP 的地方都直接讀 X-Forwarded-For，所以這裡一定要還原，
    # 否則所有外部使用者都會被記成 cloudflared 容器的同一個 172.x IP。
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # nginx 本身只聽 80，$scheme 永遠是 http；真實協定在 CF-Visitor header（JSON，例如 {"scheme":"https"}）。
    # 轉成 X-Forwarded-Proto 後，後端才能正確判斷 https。直接內網 http 存取時退回 $scheme。
    map $http_cf_visitor $client_scheme {
        default              $scheme;
        '~"scheme":"https"'  https;
    }

    # WebSocket 升級：有 Upgrade header 才送 Connection: upgrade，否則送 close
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # access log 第一欄記還原後的真實 IP，最後一欄記直接連進來的位址（tunnel 時是 cloudflared 容器）
    log_format main '$client_ip - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" via=$remote_addr';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # 不在回應標頭與錯誤頁洩漏 nginx 版本
    server_tokens off;

    # 區網使用者不經 Cloudflare，沒有邊緣壓縮；這裡自己壓 JS/CSS/JSON/SVG。
    # gzip_proxied any：經 Cloudflare Tunnel 進來的請求帶 Via header，仍要壓縮。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # 使用 Docker 內部 DNS 解析器，延遲解析上游服務直到請求到來，
    # 避免啟動時因上游容器未就緒而導致 nginx 啟動失敗（搭配 location 內的 set $upstream）
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name grading.wuretedu.com localhost;

        # 上傳上限：主程式單檔 10MB、pdf-service 50MB，取 50M 留餘裕
        client_max_body_size 50M;

        # 安全標頭放 server 層，且 location 內不再 add_header（nginx 的 add_header 不會繼承到已有 add_header 的 location），
        # 所以所有回應都會帶。HSTS 只在 https 時被瀏覽器採用，區網 http 直連會忽略。
        # 未設 CSP：React Router 的 hydration 用 inline script，正式強制前需要 nonce 機制，另案處理。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Socket.IO → 獨立的 websocket-server（對應原 k8s Ingress 的 /socket.io 規則）
        location ^~ /socket.io/ {
            set $ws http://websocket:3001;
            proxy_pass $ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # 其餘全部 → 主程式（React Router SSR；/assets/ 的長快取由 react-router-serve 自己設）
        location / {
            set $app http://app:3000;
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            # SSE（/api/grade/progress、/api/upload/progress、/api/grading/events/*）與串流回應：不緩衝
            # 對應原 Traefik 註解 responseforwarding.flushinterval=1ms
            proxy_buffering off;
            # 上傳直接串流到後端，不在 nginx 落地暫存（對應原 Traefik buffering.maxrequestbodybytes=0）
            proxy_request_buffering off;
            # AI 評分請求可能很久（對應原 Traefik request-timeout 600s）
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            client_body_timeout 300;
        }
    }
}
